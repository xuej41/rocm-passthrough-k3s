# FALLBACK ONLY: use this if amdgpu won't release the MI210 when libvirt
# (managed='yes') tries to detach it.
#
# Install:  sudo cp host/vfio-pci.conf /etc/modprobe.d/vfio-pci.conf
#           sudo update-initramfs -u && reboot
#
# This binds vfio-pci to the MI210's device ID at boot, loaded BEFORE amdgpu.
# Do NOT blacklist amdgpu, because the RX 480 (host display) needs it.
#
# Check the ID first with:  lspci -nn -d 1002: | grep -i -E 'MI210|Aldebaran'
# 1002:740f confirmed on this host (MI210 at 0000:0c:00.0, IOMMU group 28).

options vfio-pci ids=1002:740f
softdep amdgpu pre: vfio-pci
