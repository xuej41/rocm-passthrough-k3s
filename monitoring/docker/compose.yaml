# docker compose -f monitoring/docker/compose.yaml up -d
# run it wherever the GPU is visible (host before passthrough, guest after)
name: gpu-monitoring

services:
  exporter:
    image: rocm/device-metrics-exporter:v1.5.3
    hostname: gpu-node # metrics get labelled with this, otherwise it's the container id
    privileged: true
    devices:
      - /dev/dri
      - /dev/kfd
    volumes:
      - /sys:/sys:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/gpu.yaml:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
