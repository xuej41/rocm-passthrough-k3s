# kube-prometheus-stack values for a single-node k3s cluster.
# Installed by monitoring/k8s/install.sh.

alertmanager:
  enabled: false # no alert routing needed here

grafana:
  admin:
    existingSecret: grafana-admin # created by install.sh with a random password
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true # loads any ConfigMap labelled grafana_dashboard=1
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 15d
    # Pick up every ServiceMonitor/PodMonitor in the cluster, not only ones
    # labelled with this Helm release (the AMD exporter's isn't).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path # k3s's built-in provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# k3s runs these inside its own binary, so the chart's default scrape targets
# for them don't exist and would show as permanently down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
