# AMD Device Metrics Exporter (Helm chart: device-metrics-exporter-charts).
# Runs as a DaemonSet on every node; installed by monitoring/k8s/install.sh.

image:
  tag: v1.5.3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ClusterIP:
    port: 5000

# Lets Prometheus (via the Prometheus Operator) find the exporter on its own.
serviceMonitor:
  enabled: true
  interval: 5s # short, so a benchmark run shows up in detail
