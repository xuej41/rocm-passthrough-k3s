# needs the AMD device plugin running (see k8s/README.md)
apiVersion: v1
kind: Pod
metadata:
  name: rocm-smi-1gpu
spec:
  restartPolicy: Never
  containers:
    - name: rocm
      image: rocm/dev-ubuntu-22.04:latest
      imagePullPolicy: IfNotPresent # imported with k3s ctr, don't pull
      command: ["sh", "-c", "rocm-smi && rocminfo | grep -m1 -i gfx"]
      resources:
        limits:
          amd.com/gpu: 1
