# asks for 2 GPUs on a node with 1, should stay Pending
apiVersion: v1
kind: Pod
metadata:
  name: rocm-smi-2gpu
spec:
  restartPolicy: Never
  containers:
    - name: rocm
      image: rocm/dev-ubuntu-22.04:latest
      imagePullPolicy: IfNotPresent
      command: ["rocm-smi"]
      resources:
        limits:
          amd.com/gpu: 2
